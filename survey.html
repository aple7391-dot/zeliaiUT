<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보관함 비교 테스트 설문</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{--ink:#1a1a1a;--sub:#6b6b73;--navy:#1a1a2e;--mist:#f4f4f6;--off:#d9d9de}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",Roboto,sans-serif;font-size:15px;line-height:1.7;min-height:100vh;display:flex;flex-direction:column;align-items:center;letter-spacing:-.01em}
.wrap{width:100%;max-width:720px;padding-left:24px;padding-right:24px}
h1,.qtitle{font-size:clamp(18px,4vw,20px);line-height:1.35;font-weight:800;letter-spacing:-.035em;word-break:keep-all}
h2{font-size:17px;line-height:1.5;font-weight:700;letter-spacing:-.02em;word-break:keep-all}
.sub{color:var(--sub);word-break:keep-all}
ul.dots{list-style:none;display:flex;flex-direction:column;gap:14px}
ul.dots li{position:relative;padding-left:20px;word-break:keep-all}
ul.dots li::before{content:"•";position:absolute;left:2px;top:0;color:var(--ink)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:0 24px;border:0;border-radius:999px;background:var(--navy);color:#fff;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-.01em;text-decoration:none;cursor:pointer}
.cta::after{content:"→";font-size:18px;font-weight:600}
.cta:active{opacity:.85}
.cta:disabled,.cta[aria-disabled="true"]{background:var(--off);color:#fff;pointer-events:none;cursor:not-allowed}
.prog{padding-top:20px}
.bar{height:3px;background:var(--mist);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);width:0;transition:width .25s}
.cnt{margin-top:10px;font-size:13px;color:var(--sub);font-weight:600}
main{flex:1;padding-top:36px;padding-bottom:140px}
main h1{margin-bottom:10px}
main>.sub{margin-bottom:8px}
.card{margin-top:44px}
.card:first-of-type{margin-top:0}
.tag{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:18px}
.q{font-size:16px;font-weight:600;line-height:1.55;word-break:keep-all;margin-bottom:16px}
.fq{position:relative;padding-left:20px;font-size:14px;font-weight:600;margin-bottom:10px}
.fq::before{content:"•";position:absolute;left:2px}
.fgap{height:20px}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.scale button{min-height:52px;border:0;background:var(--mist);border-radius:12px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit}
.scale button.on{background:var(--navy);color:#fff}
.ends{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--sub)}
.ends span{flex:1}
.ends span:last-child{text-align:right}
textarea{width:100%;min-height:104px;border:0;border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.6;font-family:inherit;color:var(--ink);resize:vertical;outline:0;background:var(--mist)}
textarea:focus{box-shadow:inset 0 0 0 2px var(--navy)}
.choices{display:flex;flex-direction:column;gap:10px}
.choices button{min-height:56px;border:0;background:var(--mist);border-radius:14px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;text-align:left;padding:0 20px}
.choices button.on{background:var(--navy);color:#fff}
.choices.row{flex-direction:row}
.choices.row button{flex:1;text-align:center;padding:0 10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:14px 0 calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.nav .in{display:flex;align-items:center;gap:12px}
.nav .prev{flex:0 0 auto;height:56px;padding:0 8px;background:none;border:0;color:var(--sub);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.nav .next{flex:1}
.center{padding-top:72px}
.center h1{margin-bottom:14px}
.err{background:var(--mist);color:#b42318;border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:20px}
/* 질문에 곁들이는 스크린샷: 꽉 찬 폭 1장, 혹은 나란히 2장 */
.qimg{display:block;width:100%;height:auto;border-radius:16px;margin:16px 0 22px;border:1px solid var(--off)}
.imgrow{display:flex;gap:10px;margin:16px 0 22px}
.imgrow img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--off)}
.imgrow.tight{gap:0}
.imgrow .imgcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.imgrow.tight .imgcol:first-child img{border-top-right-radius:0;border-bottom-right-radius:0;border-right:none}
.imgrow.tight .imgcol:last-child img{border-top-left-radius:0;border-bottom-left-radius:0}
.imgcap{font-size:13px;font-weight:700;color:var(--sub)}
@media(min-width:900px){main{padding-top:56px}}
</style>
</head>
<body>
<header class="wrap" style="padding-top:22px;font-size:15px;font-weight:700;color:var(--sub)">보관함 비교 테스트 설문</header>
<div class="prog wrap" id="prog"><div class="bar"><i id="barFill"></i></div><div class="cnt" id="cnt"></div></div>
<main class="wrap" id="main"></main>
<div class="nav" id="nav"><div class="in wrap"><button class="prev" id="prev">이전</button><button class="cta next" id="next" disabled>다음</button></div></div>

<script src="survey/config.js"></script>
<script>
(function(){
  var C=window.SURVEY_CONFIG, L=C.LABELS, T=C.TEXT, M=['1','2'], V={'1':'c','2':'b'};
  var $=function(id){return document.getElementById(id)};
  // 1: prior_use(사전 경험) → 2: 보관함(c)만 → 3: 모으기(b)만 → 4: 비교 → 5: 마지막
  var ALL=['prior_use','1','2','compare','final'];

  /* ---------- 상태 (localStorage 복구) ---------- */
  function uuid(){
    if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
    var a=new Uint8Array(16);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach(function(_,i){a[i]=Math.random()*256});
    a[6]=a[6]&0x0f|0x40;a[8]=a[8]&0x3f|0x80;
    var h=Array.prototype.map.call(a,function(b){return('0'+b.toString(16)).slice(-2)}).join('');
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }
  function load(){try{var x=JSON.parse(localStorage.getItem(C.STORAGE_KEY))||null;if(x){x.sending=false;x.err=''}return x}catch(e){return null}}
  function save(){try{localStorage.setItem(C.STORAGE_KEY,JSON.stringify(S))}catch(e){}}
  function stored(k){try{return localStorage.getItem(k)}catch(e){return null}}
  var S=load();
  if(!S||!S.pid){
    var pidNew=stored(C.PID_KEY)||uuid();try{localStorage.setItem(C.PID_KEY,pidNew)}catch(e){}
    S={pid:pidNew,step:0,a:{},done:false};
    save();
  }
  function steps(){return ALL}
  function deviceType(){
    var mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'');
    return (mobile||window.innerWidth<768)?'mobile':'pc';
  }

  /* ---------- 유효성 ---------- */
  function filled(k){var v=S.a[k];return v!==undefined&&v!==null&&String(v).trim()!==''}
  function valid(step){
    switch(step){
      case 'prior_use':return filled('prior_use');
      case '1':case '2':return filled('seq_'+step);
      case 'compare':return filled('compare_prefer')&&filled('compare_familiar');
      case 'final':return filled('final_pick_reason');
    }
    return false;
  }

  /* ---------- 렌더 ---------- */
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function scale(key,low,high){
    var h='<div class="scale" role="radiogroup">';
    for(var i=1;i<=7;i++)h+='<button type="button" data-k="'+key+'" data-v="'+i+'" role="radio" aria-checked="'+(S.a[key]===i)+'" class="'+(S.a[key]===i?'on':'')+'">'+i+'</button>';
    return h+'</div><div class="ends"><span>1 '+esc(low)+'</span><span>7 '+esc(high)+'</span></div>';
  }
  function text(key,rows,ph){return '<textarea data-t="'+key+'" rows="'+(rows||4)+'" maxlength="1000"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+esc(S.a[key]||'')+'</textarea>'}
  function choiceBtns(key,opts,row){
    return '<div class="choices'+(row?' row':'')+'">'+opts.map(function(o){
      return '<button type="button" data-k="'+key+'" data-v="'+esc(o)+'" class="'+(S.a[key]===o?'on':'')+'">'+esc(o)+'</button>';
    }).join('')+'</div>';
  }
  function img(src){return '<img class="qimg" src="'+esc(src)+'" alt="" loading="eager">'}

  function view(step){
    var h='';
    if(step==='prior_use'){
      h+='<h1>'+esc(T.priorTitle1)+'</h1>';
      h+=img(C.IMG.prior);
      h+='<p class="qtitle">'+esc(T.priorTitle2)+'</p>';
      h+='<section class="card">'+choiceBtns('prior_use',[T.priorYes,T.priorNo])+'</section>';
    }else if(step==='1'||step==='2'){
      var v=V[step];
      h+='<h1>'+esc(T.stepTitle[v])+'</h1>';
      h+=img(C.IMG[v]);
      h+='<section class="card"><p class="q">'+esc(T.seq)+'</p>'+scale('seq_'+step,T.seqLow,T.seqHigh)+'</section>';
      h+=C.FEEDBACK.map(function(f){
        return '<p class="fq" style="margin-top:18px">'+esc(f[1])+'</p>'+text('fb_'+f[0]+'_'+step,3,C.FEEDBACK_PH[v][f[0]]);
      }).join('');
    }else if(step==='compare'){
      var opts=[T.cmpOne,T.cmpTwo];
      h+='<h1>두 방식을 비교해 주세요</h1>';
      h+='<div class="imgrow"><div class="imgcol"><img src="'+esc(C.IMG.c)+'" alt=""></div><div class="imgcol"><img src="'+esc(C.IMG.b)+'" alt=""></div></div>';
      h+='<section class="card"><p class="q">'+esc(T.comparePrefer)+'</p>'+choiceBtns('compare_prefer',opts,true)+'</section>';
      h+='<section class="card"><p class="q">'+esc(T.compareFamiliar)+'</p>'+choiceBtns('compare_familiar',opts,true)+'</section>';
    }else if(step==='final'){
      h+='<h1>'+esc(T.finalTitle)+'</h1>';
      h+='<div class="imgrow tight"><div class="imgcol"><img src="'+esc(C.IMG.c)+'" alt=""><span class="imgcap">a. 보관</span></div><div class="imgcol"><img src="'+esc(C.IMG.b)+'" alt=""><span class="imgcap">b. 모으기</span></div></div>';
      h+='<section class="card"><p class="q">'+esc(T.pickReason)+'</p>'+text('final_pick_reason',5)+'</section>';
    }
    return h;
  }

  function render(){
    var main=$('main');
    if(S.done){
      $('prog').style.display='none';$('nav').style.display='none';
      main.innerHTML='<div class="center"><h1>참여해 주셔서<br>감사합니다</h1><p class="sub">소중한 의견은 서비스 개선에 큰 도움이 됩니다.</p><p class="sub" style="margin-top:22px;color:var(--ink);font-weight:700">테스트가 종료되어 화면을 닫아주시면 됩니다.<br>수고 많으셨습니다.</p></div>';
      return;
    }
    var list=steps(), step=list[S.step];
    $('barFill').style.width=((S.step+1)/list.length*100)+'%';
    $('cnt').textContent=(S.step+1)+' / '+list.length;
    main.innerHTML=(S.err?'<div class="err">'+esc(S.err)+'</div>':'')+view(step);
    $('prev').style.visibility=S.step===0?'hidden':'visible';
    $('next').textContent=S.step===list.length-1?(S.sending?'제출 중…':'제출하기'):'다음';
    updateNext();
    window.scrollTo(0,0);
  }
  function updateNext(){$('next').disabled=!valid(steps()[S.step])||!!S.sending}

  /* ---------- 입력 ---------- */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-k]');
    if(!b||!$('main').contains(b))return;
    var v=b.getAttribute('data-v');
    S.a[b.getAttribute('data-k')]=/^\d+$/.test(v)?Number(v):v;
    save();
    b.parentElement.querySelectorAll('button').forEach(function(x){
      var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)});
    updateNext();
  });
  $('main').addEventListener('input',function(e){
    var k=e.target.getAttribute&&e.target.getAttribute('data-t');
    if(!k)return;S.a[k]=e.target.value;save();updateNext();
  });

  $('prev').onclick=function(){if(S.step>0){S.step--;S.err='';save();render()}};
  $('next').onclick=function(){
    if($('next').disabled)return;
    if(S.step<steps().length-1){S.step++;S.err='';save();render();return}
    submit();
  };

  /* ---------- 제출 ---------- */
  function submit(){
    if(S.sending||S.done)return;
    S.sending=true;S.err='';$('next').disabled=true;$('next').textContent='제출 중…';
    var payload={
      participant_id:S.pid,
      prior_use:S.a.prior_use,              // "예" | "아니요"
      order:'1then2',                       // 노출 순서 고정: 보관함(c) 먼저, 모으기(b) 다음
      device_type:deviceType(),
      mapping:C.MAPPING,                    // 방식 번호 → 실제 버전
      answers:S.a
    };
    fetch(C.SUBMIT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
      .then(function(o){
        S.sending=false;
        if(o.ok&&o.j&&o.j.ok){S.done=true;S.err='';save();render()}
        else throw new Error((o.j&&o.j.error)||'save_failed');
      })
      .catch(function(){
        S.sending=false;
        S.err='제출하지 못했어요. 네트워크를 확인하고 다시 시도해 주세요. (입력한 내용은 저장되어 있어요)';
        save();render();
      });
  }

  render();
})();
</script>
</body>
</html>
