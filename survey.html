<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>젤리아이 UX 설문</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14142b;--sub:#5d6178;--line:#e4e6ef;--brand:#4f46e5;--brand-soft:#eef0ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo",Roboto,sans-serif;line-height:1.55;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:720px;padding:18px 20px 0;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.dot{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.prog{width:100%;max-width:720px;padding:16px 20px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.cnt{margin-top:8px;font-size:13px;color:var(--sub);font-weight:600}
main{width:100%;max-width:720px;padding:20px 20px 120px;flex:1}
h1{font-size:22px;line-height:1.4;font-weight:800;letter-spacing:-.02em;word-break:keep-all;margin-bottom:6px}
.sub{color:var(--sub);font-size:15px;margin-bottom:18px;word-break:keep-all}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.tag{display:inline-block;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;margin-bottom:10px}
.q{font-size:17px;font-weight:700;line-height:1.5;word-break:keep-all;margin-bottom:14px}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.scale button{min-height:48px;border:2px solid var(--line);background:#fff;border-radius:12px;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.scale button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ends{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;color:var(--sub)}
.ends span{flex:1}
.ends span:last-child{text-align:right}
textarea{width:100%;min-height:112px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--ink);resize:vertical;outline:0;background:#fff}
textarea:focus{border-color:var(--brand)}
.shot{display:block;width:100%;max-width:300px;margin:0 auto 16px;border:1px solid var(--line);border-radius:14px;cursor:zoom-in;background:#fff}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pair figure{text-align:center}
.pair figcaption{font-weight:800;font-size:15px;margin-bottom:8px}
.pair img{width:100%;border:1px solid var(--line);border-radius:12px;cursor:zoom-in;background:#fff}
.hint{font-size:12.5px;color:var(--sub);text-align:center;margin:-6px 0 14px}
.choices{display:flex;flex-direction:column;gap:10px}
.choices button{min-height:52px;border:2px solid var(--line);background:#fff;border-radius:14px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.choices button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fffffff0;border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;backdrop-filter:blur(6px)}
.nav .in{width:100%;max-width:720px;display:flex;gap:10px}
.nav button{height:54px;border-radius:14px;font-size:17px;font-weight:800;border:0;cursor:pointer;font-family:inherit}
.nav .prev{flex:0 0 96px;background:#fff;border:2px solid var(--line);color:var(--ink)}
.nav .next{flex:1;background:var(--brand);color:#fff}
.nav .next:disabled{background:#d9dbe6;color:#8b8fa3;cursor:not-allowed}
.center{text-align:center;padding-top:56px}
.center .big{font-size:52px;margin-bottom:10px}
.err{background:#fff0f0;border:1px solid #ffc9c9;color:#b42318;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.lb{position:fixed;inset:0;background:#000d;z-index:50;overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.lb.show{display:block}
.lb img{display:block;width:100vw;max-width:none;margin:0 auto;cursor:zoom-in}
.lb.z img{width:220vw;cursor:zoom-out}
.lb .x{position:fixed;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#000;font-size:22px;z-index:51;cursor:pointer}
.lb .tip{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#fff;font-size:13px;z-index:51;pointer-events:none}
@media(max-width:380px){.q{font-size:16px}.scale button{font-size:15px}}
.card.v-before .tag{background:#eceef3;color:#5d6178}
.card.v-before .scale button.on{background:#6b7080;border-color:#6b7080;color:#fff}
.card.v-before textarea:focus{border-color:#6b7080}
.ghost{display:flex;width:fit-content;align-items:center;gap:6px;min-height:44px;padding:0 14px;margin:0 0 14px;border:1.5px solid var(--line);background:transparent;border-radius:12px;color:var(--sub);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.ghost:hover,.ghost:active{border-color:var(--brand);color:var(--brand)}
.card.v-before .ghost:hover,.card.v-before .ghost:active{border-color:#6b7080;color:#40445a}
h1.long{font-size:20px;margin-bottom:18px}
.lb.pop{background:#000a;overflow:hidden;display:none;align-items:center;justify-content:center}
.lb.pop.show{display:flex}
.lb.pop img{width:auto;height:auto;max-width:min(300px,calc(100vw - 32px));max-height:calc(100vh - 110px);margin:0;border-radius:14px;background:#fff;cursor:pointer}
.lb.pop .tip{display:none}
</style>
</head>
<body>
<header><span class="dot">Z</span>젤리아이 UX 설문</header>
<div class="prog" id="prog"><div class="bar"><i id="barFill"></i></div><div class="cnt" id="cnt"></div></div>
<main id="main"></main>
<div class="nav" id="nav"><div class="in"><button class="prev" id="prev">이전</button><button class="next" id="next" disabled>다음</button></div></div>

<div class="lb" id="lb" role="dialog" aria-label="이미지 확대"><button class="x" id="lbX" aria-label="닫기">✕</button><img id="lbImg" alt=""><div class="tip" id="lbTip">탭하면 확대/축소 · 스크롤로 이동</div></div>

<script src="survey/config.js"></script>
<script>
(function(){
  var C=window.SURVEY_CONFIG, L=C.LABELS, T=C.TEXT;
  var $=function(id){return document.getElementById(id)};
  var STEPS=['q1','q2','q3a','q3b','q4','q5'];

  /* ---------- 상태 (localStorage 복구) ---------- */
  function uuid(){
    if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
    var a=new Uint8Array(16);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach(function(_,i){a[i]=Math.random()*256});
    a[6]=a[6]&0x0f|0x40;a[8]=a[8]&0x3f|0x80;
    var h=Array.prototype.map.call(a,function(b){return('0'+b.toString(16)).slice(-2)}).join('');
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }
  function load(){try{var x=JSON.parse(localStorage.getItem(C.STORAGE_KEY))||null;if(x){x.sending=false;x.err=''}return x}catch(e){return null}}
  function save(){try{localStorage.setItem(C.STORAGE_KEY,JSON.stringify(S))}catch(e){}}
  function shuffle2(){return Math.random()<.5?['before','after']:['after','before']}
  var S=load();
  if(!S||!S.pid){
    var shared=null;try{shared=localStorage.getItem('zeli_pid')}catch(e){}
    var pidNew=shared||uuid();try{localStorage.setItem('zeli_pid',pidNew)}catch(e){}
    S={pid:pidNew,step:0,a:{},o3:shuffle2(),l4:Math.random()<.5?'before_left':'after_left',done:false};
    save();
  }
  function stored(k){try{return localStorage.getItem(k)}catch(e){return null}}

  /* ---------- 유효성 ---------- */
  function filled(k){var v=S.a[k];return v!==undefined&&v!==null&&String(v).trim()!==''}
  function valid(step){
    switch(step){
      case 'q1':return filled('seq_before')&&filled('seq_after');
      case 'q2':return filled('open_before')&&filled('open_after');
      case 'q3a':return filled('imp_'+S.o3[0]);
      case 'q3b':return filled('imp_'+S.o3[1]);
      case 'q4':return filled('compare_choice')&&filled('compare_reason');
      case 'q5':return filled('intent_before')&&filled('intent_after')&&filled('intent_open_before')&&filled('intent_open_after');
    }
    return false;
  }

  /* ---------- 렌더 ---------- */
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function scale(key,low,high){
    var h='<div class="scale" role="radiogroup">';
    for(var i=1;i<=7;i++)h+='<button type="button" data-k="'+key+'" data-v="'+i+'" role="radio" aria-checked="'+(S.a[key]===i)+'" class="'+(S.a[key]===i?'on':'')+'">'+i+'</button>';
    return h+'</div><div class="ends"><span>1 '+esc(low)+'</span><span>7 '+esc(high)+'</span></div>';
  }
  function text(key,rows){return '<textarea data-t="'+key+'" rows="'+(rows||4)+'" maxlength="1000">'+esc(S.a[key]||'')+'</textarea>'}
  function block(v,inner){return '<section class="card v-'+v+'"><span class="tag">'+esc(L[v])+'</span>'+inner+'</section>'}

  function view(step){
    var h='';
    if(step==='q1'){
      h+='<h1>과제를 마친 소감을 알려주세요</h1><p class="sub">버전별로 각각 답해 주세요.</p>';
      ['before','after'].forEach(function(v){
        h+=block(v,'<p class="q">'+esc(T.seq)+'</p>'+scale('seq_'+v,T.seqLow,T.seqHigh));
      });
    }else if(step==='q2'){
      h+='<h1 class="long">'+esc(T.experienceTitle)+'</h1>';
      ['before','after'].forEach(function(v){
        h+=block(v,'<button type="button" class="ghost" data-img="'+C.IMAGES.chat[v]+'" data-alt="'+esc(C.ALT.chat[v])+'">'+esc(T.reviewImage)+'</button>'+text('open_'+v));
      });
    }else if(step==='q3a'||step==='q3b'){
      var v=S.o3[step==='q3a'?0:1];
      h+='<h1>첫인상을 알려주세요</h1><p class="sub">'+(step==='q3a'?'1':'2')+' / 2</p>';
      h+='<img class="shot" data-zoom="1" src="'+C.IMAGES.start[v]+'" alt="'+esc(C.ALT.start[v])+'">';
      h+='<p class="hint">이미지를 탭하면 크게 볼 수 있어요</p>';
      h+='<section class="card"><p class="q">'+esc(T.firstImpression)+'</p>'+text('imp_'+v)+'</section>';
    }else if(step==='q4'){
      var order=S.l4==='before_left'?['before','after']:['after','before'];
      h+='<h1>두 화면을 비교해 주세요</h1><p class="sub">이미지를 탭하면 크게 볼 수 있어요.</p><div class="pair">';
      order.forEach(function(v){
        h+='<figure><figcaption>'+esc(L[v])+'</figcaption><img data-zoom="1" src="'+C.IMAGES.chat[v]+'" alt="'+esc(C.ALT.chat[v])+'"></figure>';
      });
      h+='</div><section class="card"><p class="q">'+esc(T.compareChoice)+'</p><div class="choices">';
      order.concat(['same']).forEach(function(v){
        var lab=v==='same'?T.compareSame:L[v];
        h+='<button type="button" data-k="compare_choice" data-v="'+v+'" class="'+(S.a.compare_choice===v?'on':'')+'">'+esc(lab)+'</button>';
      });
      h+='</div></section><section class="card"><p class="q">'+esc(T.compareReason)+'</p>'+text('compare_reason')+'</section>';
    }else if(step==='q5'){
      h+='<h1>마지막 질문이에요</h1><p class="sub">버전별로 각각 답해 주세요.</p>';
      ['before','after'].forEach(function(v){
        h+=block(v,'<p class="q">'+esc(T.intent.replace('{label}',L[v]))+'</p>'+scale('intent_'+v,T.intentLow,T.intentHigh)+
          '<p class="q" style="margin-top:20px">'+esc(T.intentReason)+'</p>'+text('intent_open_'+v));
      });
    }
    return h;
  }

  function render(){
    var main=$('main');
    if(S.done){
      $('prog').style.display='none';$('nav').style.display='none';
      main.innerHTML='<div class="center"><div class="big">🙌</div><h1>참여해 주셔서 감사합니다</h1><p class="sub">소중한 의견은 서비스 개선에 큰 도움이 됩니다.</p><p class="sub" style="margin-top:18px;color:var(--ink);font-weight:700">테스트가 종료되어 화면을 닫아주시면 됩니다.<br>수고 많으셨습니다.</p></div>';
      return;
    }
    var step=STEPS[S.step];
    $('barFill').style.width=((S.step+1)/STEPS.length*100)+'%';
    $('cnt').textContent=(S.step+1)+' / '+STEPS.length;
    main.innerHTML=(S.err?'<div class="err">'+esc(S.err)+'</div>':'')+view(step);
    $('prev').style.visibility=S.step===0?'hidden':'visible';
    $('next').textContent=S.step===STEPS.length-1?(S.sending?'제출 중…':'제출하기'):'다음';
    updateNext();
    main.scrollTop=0;window.scrollTo(0,0);
  }
  function updateNext(){$('next').disabled=!valid(STEPS[S.step])||!!S.sending}

  /* ---------- 입력 ---------- */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-k]');
    if(b&&$('main').contains(b)){
      var v=b.getAttribute('data-v');
      S.a[b.getAttribute('data-k')]=/^\d+$/.test(v)?Number(v):v;
      save();
      if(b.classList.contains('choices')||b.parentElement.classList.contains('choices')||b.parentElement.classList.contains('scale')){
        b.parentElement.querySelectorAll('button').forEach(function(x){
          var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)});
      }
      updateNext();return;
    }
    var gh=e.target.closest&&e.target.closest('[data-img]');
    if(gh){$('lbImg').src=gh.getAttribute('data-img');$('lbImg').alt=gh.getAttribute('data-alt')||'';$('lb').classList.remove('z');$('lb').classList.add('pop','show');return}
    var im=e.target.closest&&e.target.closest('[data-zoom]');
    if(im){$('lbImg').src=im.src;$('lbImg').alt=im.alt;$('lb').classList.remove('z','pop');$('lb').classList.add('show');return}
  });
  $('main').addEventListener('input',function(e){
    var k=e.target.getAttribute&&e.target.getAttribute('data-t');
    if(!k)return;S.a[k]=e.target.value;save();updateNext();
  });
  $('lb').addEventListener('click',function(e){
    if(e.target===$('lbX')||$('lb').classList.contains('pop')){$('lb').classList.remove('show','z','pop');return}
    $('lb').classList.toggle('z');
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')$('lb').classList.remove('show','z','pop')});

  $('prev').onclick=function(){if(S.step>0){S.step--;S.err='';save();render()}};
  $('next').onclick=function(){
    if($('next').disabled)return;
    if(S.step<STEPS.length-1){S.step++;S.err='';save();render();return}
    submit();
  };

  /* ---------- 제출 ---------- */
  function submit(){
    if(S.sending||S.done)return;
    S.sending=true;S.err='';$('next').disabled=true;$('next').textContent='제출 중…';
    var payload={
      participant_id:S.pid,
      // 기존 UT 화면이 체험 순서(시각)를 기록하지 않아 알 수 없음 → null
      first_version:null,
      first_impression_order:S.o3,
      compare_layout:S.l4,
      task_result:{},
      answers:S.a
    };
    ['before','after'].forEach(function(v){
      var r=stored(C.EXISTING_KEYS.result[v]);
      if(r)payload.task_result[v]={result:r};
    });
    fetch(C.SUBMIT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
      .then(function(o){
        S.sending=false;
        if(o.ok&&o.j&&o.j.ok){S.done=true;S.err='';save();render()}
        else throw new Error((o.j&&o.j.error)||'save_failed');
      })
      .catch(function(){
        S.sending=false;
        S.err='제출하지 못했어요. 네트워크를 확인하고 다시 시도해 주세요. (입력한 내용은 저장되어 있어요)';
        save();render();
      });
  }

  render();
})();
</script>
</body>
</html>
