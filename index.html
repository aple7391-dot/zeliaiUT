<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지금 여기 트렌드는 — 보관함 비교 테스트</title>
<meta name="description" content="카드 보관함 모으기 방식 비교 테스트 시작 화면">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{--ink:#1a1a1a;--sub:#6b6b73;--navy:#1a1a2e;--mist:#f4f4f6;--off:#d9d9de}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",Roboto,sans-serif;font-size:15px;line-height:1.7;min-height:100vh;display:flex;flex-direction:column;align-items:center;letter-spacing:-.01em}
.wrap{width:100%;max-width:720px;padding-left:24px;padding-right:24px}
h1{font-size:clamp(18px,4vw,20px);line-height:1.35;font-weight:800;letter-spacing:-.035em;word-break:keep-all}
h2{font-size:17px;line-height:1.5;font-weight:700;letter-spacing:-.02em;word-break:keep-all}
.sub{color:var(--sub);word-break:keep-all}
ul.dots{list-style:none;display:flex;flex-direction:column;gap:14px}
ul.dots li{position:relative;padding-left:20px;word-break:keep-all}
ul.dots li::before{content:"•";position:absolute;left:2px;top:0;color:var(--ink)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:0 24px;border:0;border-radius:999px;background:var(--navy);color:#fff;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-.01em;text-decoration:none;cursor:pointer}
.cta::after{content:"→";font-size:18px;font-weight:600}
.cta:active{opacity:.85}
.cta:disabled,.cta[aria-disabled="true"]{background:var(--off);color:#fff;pointer-events:none;cursor:not-allowed}
main{flex:1;padding-top:44px;padding-bottom:48px}
.lead{margin-top:14px;font-size:15px}
section{margin-top:56px}
section h2{margin-bottom:22px}
.note{margin-top:22px;font-size:13px;color:var(--sub);word-break:keep-all}
.opts{display:flex;flex-direction:column;gap:6px}
.how{font-size:13px;color:var(--sub);margin:0 0 14px 24px}
.opt .lbl{display:flex;align-items:center;gap:10px}
.opt .ic{flex:none}
.opt small{font-size:13px;font-weight:600;opacity:.7;margin-left:8px}
.finish{margin-top:40px}
.finish .hint{margin-top:10px;text-align:center;font-size:13px;color:var(--sub)}
.finish .hint.done{display:none}
@media(min-width:900px){main{padding-top:72px}}
</style>
</head>
<body>
<main class="wrap">
  <h1>지금 여기 트렌드는<br>— 보관함 비교 테스트</h1>
  <p class="lead sub">두 가지 카드 모으기 방식을 순서대로 써보고, 아래 과제를 해보세요.</p>

  <section aria-label="과제">
    <h2>과제</h2>
    <ul class="dots">
      <li>전체 탭에서 모으기 기능으로 마음에 드는 카드를 모아보세요.</li>
      <li>모은 카드를 찾아 선택해서 훑어보세요.</li>
    </ul>
    <p class="note">개수·시간 제한 없이 편하게 해보세요.</p>
  </section>

  <section>
    <h2>테스트할 방식을 선택하세요</h2>
    <nav class="opts" id="opts">
      <a class="cta opt" id="opt1" data-n="1" href="https://its-psi-eight.vercel.app/?v=c" target="_blank" rel="opener"><span class="lbl"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>보관-비우기</span></a>
      <p class="how">보관함 아이콘에서 시작해요</p>
      <a class="cta opt" id="opt2" data-n="2" href="https://its-psi-eight.vercel.app/?v=b" target="_blank" rel="opener"><span class="lbl"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="9" width="12" height="12" rx="2"/><path d="M8 5h10a2 2 0 0 1 2 2v10"/><path d="M10 13v4M8 15h4"/></svg>모으기-비우기</span></a>
      <p class="how">하단 버튼에서 시작해요</p>
    </nav>
  </section>

  <section class="finish">
    <a class="cta" id="survey" href="survey.html" aria-disabled="true"><span>설문 작성하기</span></a>
    <p class="hint" id="surveyHint">두 방식을 모두 체험한 뒤 돌아오면 작성할 수 있어요</p>
  </section>
</main>
<script>
// 두 방식을 모두 열어본 뒤에만 설문 버튼 활성화 
(function(){
  var K={'1':'its_vault_done_1','2':'its_vault_done_2'};
  function get(k){try{return localStorage.getItem(k)==='1'}catch(e){return false}}
  function set(k){try{localStorage.setItem(k,'1')}catch(e){}}

  // 테스트 세션 표시(guide=1) + 설문 안내 화면으로 돌아올 주소(ret)를 링크에 붙임
  var RET=encodeURIComponent(location.href.split('#')[0].split('?')[0]);
  document.querySelectorAll('.opt').forEach(function(a){a.href=a.getAttribute('href')+'&guide=1&ret='+RET});
  // 열린 its 탭에서 닫기(X)를 누르면 체험 종료로 기록
  window.addEventListener('message',function(e){
    var d=e.data;
    if(!d||d.type!=='its-vault-done'||(d.n!=='1'&&d.n!=='2'))return;
    var ok=false;document.querySelectorAll('.opt').forEach(function(a){try{if(new URL(a.getAttribute('href')).origin===e.origin)ok=true}catch(x){}});
    if(ok){set(K[d.n]);refresh()}
  });

  function refresh(){
    var ok=get(K['1'])&&get(K['2']);
    document.getElementById('survey').setAttribute('aria-disabled',ok?'false':'true');
    document.getElementById('surveyHint').classList.toggle('done',ok);
    ['1','2'].forEach(function(n){document.getElementById('opt'+n).classList.toggle('done',get(K[n]))});
  }
  // 외부 주소라 돌아왔는지 알 수 없으므로, 눌러서 열었을 때 체험한 것으로 기록
  document.querySelectorAll('.opt').forEach(function(a){
    a.addEventListener('click',function(){set(K[a.getAttribute('data-n')]);refresh()});
  });
  document.getElementById('survey').addEventListener('click',function(e){
    if(this.getAttribute('aria-disabled')==='true')e.preventDefault();
  });
  window.addEventListener('pageshow',refresh);
  window.addEventListener('focus',refresh);
  refresh();
})();
</script>
</body>
</html>
