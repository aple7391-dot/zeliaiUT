<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모으기/보관함 비교 테스트</title>
<meta name="description" content="카드 모으기/보관함 방식 비교 테스트 시작 화면">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{--ink:#1a1a1a;--sub:#6b6b73;--navy:#1a1a2e;--mist:#f4f4f6;--line:#e4e4e8;--ok:#1a8f4c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",Roboto,sans-serif;font-size:15px;line-height:1.6;letter-spacing:-.01em}
main{max-width:480px;margin:0 auto;padding:32px 20px 48px}
section+section{margin-top:32px}
.label{font-size:13px;color:var(--sub)}
h1{margin-top:6px;font-size:20px;line-height:1.4;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{font-size:15px;line-height:1.5;font-weight:700}
.tag{flex:none;font-size:12px;line-height:1;color:var(--sub);background:var(--mist);padding:6px 10px;border-radius:999px}
ol{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:10px}
li{display:flex;align-items:flex-start;gap:10px;font-size:15px}
li b{flex:none;width:20px;height:20px;margin-top:2px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none}
.opt:active{background:var(--mist)}
.opt .ic{flex:none;width:20px;height:20px}
.opt .txt{flex:1;min-width:0}
.opt .t1{display:block;font-size:15px;font-weight:600;line-height:1.4}
.opt .t2{display:block;font-size:13px;color:var(--sub);line-height:1.4;margin-top:2px}
.opt .st{flex:none;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ok)}
.opt .arrow{display:inline;font-size:16px;font-weight:600;color:var(--sub)}
.opt .done{display:none}
.opt.is-done .done{display:inline-flex;align-items:center;gap:4px}
.opt.is-done .arrow{display:none}
.go{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:14px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;text-decoration:none;font-family:inherit}
.go[aria-disabled="true"]{background:#e4e4e8;color:#8b8b93;pointer-events:none;cursor:not-allowed}
.note{margin-top:8px;font-size:13px;color:var(--sub)}
.note.hidden{display:none}
</style>
</head>
<body>
<main>
  <section>
    <p class="label">지금 여기 트렌드는 사이트 유저 테스트</p>
    <h1>모으기/보관함 비교 테스트</h1>
  </section>

  <section aria-label="과제">
    <div class="head"><h2>과제</h2><span class="tag">개수·시간 제한 없음</span></div>
    <ol>
      <li><b>1</b><span>전체 탭에서 마음에 드는 카드를 모으기</span></li>
      <li><b>2</b><span>모은 카드를 찾아 훑어보기</span></li>
    </ol>
  </section>

  <section>
    <h2>두 방식을 모두 체험해 주세요</h2>
    <nav class="opts" id="opts">
      <a class="opt" id="opt2" data-n="2" href="https://its-psi-eight.vercel.app/?v=b" target="_blank" rel="opener">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="9" width="12" height="12" rx="2"/><path d="M8 5h10a2 2 0 0 1 2 2v10"/><path d="M10 13v4M8 15h4"/></svg>
        <span class="txt"><span class="t1">모으기-비우기</span><span class="t2">하단 버튼에서 시작해요</span></span>
        <span class="st"><span class="arrow" aria-hidden="true">→</span><span class="done"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>체험 완료</span></span>
      </a>
      <a class="opt" id="opt1" data-n="1" href="https://its-psi-eight.vercel.app/?v=c" target="_blank" rel="opener">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="txt"><span class="t1">보관-비우기</span><span class="t2">보관함 아이콘에서 시작해요</span></span>
        <span class="st"><span class="arrow" aria-hidden="true">→</span><span class="done"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>체험 완료</span></span>
      </a>
    </nav>
  </section>

  <section>
    <a class="go" id="survey" href="survey.html" aria-disabled="true">설문 작성하기</a>
    <p class="note" id="surveyHint">두 방식을 모두 체험하면 열려요</p>
  </section>
</main>
<script>
// 두 방식을 모두 열어본 뒤에만 설문 버튼 활성화
(function(){
  var K={'1':'its_vault_done_1','2':'its_vault_done_2'};
  function get(k){try{return localStorage.getItem(k)==='1'}catch(e){return false}}
  function set(k){try{localStorage.setItem(k,'1')}catch(e){}}

  // 테스트 세션 표시(guide=1) + 설문 안내 화면으로 돌아올 주소(ret)를 링크에 붙임
  var RET=encodeURIComponent(location.href.split('#')[0].split('?')[0]);
  document.querySelectorAll('.opt').forEach(function(a){a.href=a.getAttribute('href')+'&guide=1&ret='+RET});
  // 열린 its 탭에서 닫기(X)를 누르면 체험 종료로 기록
  window.addEventListener('message',function(e){
    var d=e.data;
    if(!d||d.type!=='its-vault-done'||(d.n!=='1'&&d.n!=='2'))return;
    var ok=false;document.querySelectorAll('.opt').forEach(function(a){try{if(new URL(a.getAttribute('href')).origin===e.origin)ok=true}catch(x){}});
    if(ok){set(K[d.n]);refresh()}
  });

  function refresh(){
    var ok=get(K['1'])&&get(K['2']);
    document.getElementById('survey').setAttribute('aria-disabled',ok?'false':'true');
    document.getElementById('surveyHint').classList.toggle('hidden',ok);
    ['1','2'].forEach(function(n){document.getElementById('opt'+n).classList.toggle('is-done',get(K[n]))});
  }
  // 외부 주소라 돌아왔는지 알 수 없으므로, 눌러서 열었을 때 체험한 것으로 기록
  document.querySelectorAll('.opt').forEach(function(a){
    a.addEventListener('click',function(){set(K[a.getAttribute('data-n')]);refresh()});
  });
  document.getElementById('survey').addEventListener('click',function(e){
    if(this.getAttribute('aria-disabled')==='true')e.preventDefault();
  });
  window.addEventListener('pageshow',refresh);
  window.addEventListener('focus',refresh);
  refresh();
})();
</script>
</body>
</html>
