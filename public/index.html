<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>젤리아이 UT 시작</title>
<meta name="description" content="젤리아이 개선 전/후 선택 화면">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#2a2a2e;font-family:-apple-system,"Noto Sans KR","Apple SD Gothic Neo",Roboto,sans-serif;color:#e8e8ec;display:flex;justify-content:center;align-items:center;min-height:100vh}
#phone{width:100%;max-width:412px;height:100vh;max-height:880px;background:#121419;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:0 28px}
@media(min-width:500px){#phone{border-radius:28px;box-shadow:0 20px 60px #000a}}
.btn{display:flex;align-items:center;justify-content:center;height:72px;border-radius:14px;font-size:18px;font-weight:700;text-decoration:none;color:#e8e8ec;background:#1b1d23;border:1px solid #2b2d36;transition:.2s}
.btn:active,.btn:hover{border-color:#8ab4ff;color:#8ab4ff}
</style>
</head>
<body>
<div id="phone">
  <a class="btn" id="before" href="before.html">젤리아이 개선 전</a>
  <a class="btn" id="after" href="after.html">젤리아이 개선 후</a>
</div>
</body>
</html>
